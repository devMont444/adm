<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVA Reverso - Mural</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117; /* Fundo Preto */
            color: #f0f6fc; /* Texto Claro */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            color: #3b82f6; /* Azul em destaque */
            margin-bottom: 5px;
        }

        header p {
            color: #8b949e;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        form {
            background: #161b22; /* Card Cinza Escuro */
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input[type="text"], input[type="url"], textarea {
            width: 100%;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #f0f6fc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6; /* Borda Azul ao focar */
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            width: 100%;
            background-color: #3b82f6; /* Botão Azul */
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }

        #statusMensagem {
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
        }

        h2 {
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            width: 100%;
        }

        #listaAtividades {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .card-atividade {
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #30363d;
            border-left: 5px solid #3b82f6;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-header h3 {
            margin: 0;
            color: #3b82f6;
        }

        .data-envio {
            font-size: 12px;
            color: #8b949e;
        }

        .link-entrega {
            display: inline-block;
            background-color: #21262d;
            padding: 8px 12px;
            border-radius: 6px;
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>

    <header>
        <h1>AVA Reverso</h1>
        <p>Enviar link da atividade ou trabalho</p>
    </header>

    <div class="container">
        <form id="formAtividade">
            <div class="form-group">
                <label for="estudanteId">Seu Nome / Registro</label>
                <input type="text" id="estudanteId" placeholder="Ex: João Silva ou Seu RM" required>
            </div>

            <div class="form-group">
                <label for="tituloAtividade">Título do Projeto</label>
                <input type="text" id="tituloAtividade" placeholder="Ex: Exercício de JavaScript, API Rest" required>
            </div>

            <div class="form-group">
                <label for="descricaoAtividade">Descrição Breve (Opcional)</label>
                <textarea id="descricaoAtividade" placeholder="Conte um pouco sobre as tecnologias que usou..."></textarea>
            </div>

            <div class="form-group">
                <label for="linkArquivo">link da atividade</label>
                <input type="url" id="linkArquivo" placeholder="https://seu-site.com/atividade" required>
            </div>

            <button type="submit">Enviar Atividade</button>
            <div id="statusMensagem"></div>
        </form>

        <h2>Mural de Atividades</h2>
        <div id="listaAtividades"></div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
